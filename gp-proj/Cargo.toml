[package]
name = "gp-proj"
version.workspace = true
description = "Geodetic and map projection primitives for the GeoPlegma DGGRS ecosystem"
license = "MIT OR Apache-2.0"
edition = "2024"
readme = "README.md"
rust-version = "1.88"

[dependencies]
geo = "0.30.0"
thiserror = "2.0.12"
geoplegma = { path = "../geoplegma" }

[[example]]
name = "basic"
path = "example/basic.rs"

[[example]]
name = "polygon"
path = "example/polygon.rs"

[[example]]
name = "inverse"
path = "example/inverse.rs"

[[example]]
name = "barycentric"
path = "example/barycentric.rs"

