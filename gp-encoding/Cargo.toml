[package]
name = "gp-encoding"
version.workspace = true
publish = false # depends on geoplegma, which is blocked on crates.io (see geoplegma/Cargo.toml)
license = "MIT OR Apache-2.0"
edition = "2024"
readme = "../README.md"
rust-version = "1.88"

[dependencies]
geoplegma = { path = "../geoplegma", features = ["serde"] }
gdal = { version = "0.19", features = ["bindgen"] }
geo = "0.30"
chrono = "0.4"
rayon = "1.11"
geo-types = "0.7"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
indicatif = "0.17"
zarrs = { version = "0.23", features = ["filesystem", "zstd", "gzip", "ndarray"] }
zarrs_filesystem = "0.3"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "gp-encoding"
path = "src/main.rs"

[[bench]]
name = "convert"
harness = false

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
rand = "0.8.5"

